spring.application.name=bank-settlement-batch
# general purpose daily settlement batch system

# MySQL
# rewriteBatchedStatements=true 가 있어야 Hibernate batch insert가 진짜 multi-row INSERT로 변환됨
spring.datasource.url=jdbc:mysql://localhost:3307/settlement_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=settlement1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Hibernate batch insert/update — saveAll/대량 INSERT 시 INSERT 1000개를 한 번의 multi-row INSERT로 묶어 성능 ↑
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Spring Batch - DB에 메타데이터 저장 (실행이력 추적용)
spring.batch.jdbc.initialize-schema=always
# Spring Boot 자동 실행 비활성화. JobInvoker가 --job= 인자를 받아 명시적으로 실행
spring.batch.job.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
