spring.application.name=bank-settlement-batch
# general purpose daily settlement batch system

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/settlement_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=settlement1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Spring Batch - DB에 메타데이터 저장 (실행이력 추적용)
spring.batch.jdbc.initialize-schema=always
# Spring Boot 자동 실행 비활성화. JobInvoker가 --job= 인자를 받아 명시적으로 실행
spring.batch.job.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
